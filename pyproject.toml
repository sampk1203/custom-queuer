[project]
name = "queuer"
version = "0.1.0"
description = "Personal job queue: qur CLI + queuerd daemon with Telegram notifications"
readme = "README.md"
authors = [{ name = "Sameer Kulkarni", email = "sampk1203@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
    "segno>=1.6.0",
    "typer>=0.27.0",
]

[project.scripts]
queuer = "queuer.cli:app"
qur = "queuer.cli:app"
queuerd = "queuer.daemon:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]  # keep in step with UV_VERSION in install.sh (tests/test_install_sh.py checks)
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# ---------------------------------------------------------------------------
# Static checks (run in CI: .github/workflows/ci.yml, job "lint")
# ---------------------------------------------------------------------------

[tool.mypy]
files = ["src"]
python_version = "3.10"  # = the requires-python floor, so a 3.11+ only API is caught here, not just by the CI matrix
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
target-version = "py310"  # = the requires-python floor
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, isort. E501 (line length) is left to taste: the CLI
# help strings are long on purpose.
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer's idiom is `x: str = typer.Option(...)` in the signature.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.bandit]
# B101 (assert): the daemon uses `assert self.conn is not None` only to narrow types.
skips = ["B101"]
exclude_dirs = ["tests", ".venv"]
