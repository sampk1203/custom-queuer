[project]
name = "queuer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Sameer Kulkarni", email = "sampk1203@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["rich>=15.0.0", "typer>=0.27.0"]

[project.scripts]
queuer = "queuer.cli:app"
qur = "queuer.cli:app"
queuerd = "queuer.daemon:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
