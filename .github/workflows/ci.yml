name: ci

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.15 is brand new: let it report without blocking the other versions.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml says requires-python >= 3.10, so 3.10 is the oldest version that can install
        # this project. (mypy and ruff also target 3.10, so a 3.11+ only API is flagged by the lint job too.)
        python-version: ["3.10","3.11","3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  lint:
    name: lint (mypy, ruff, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"
      - name: Install the locked environment
        run: uv sync --locked
      # The tools run from uv's cache with `--with`/`uvx`, so uv.lock is not touched. Their versions
      # are pinned: a new release cannot turn CI red or run new code unreviewed; bump them
      # by hand (or with dependabot) together with whatever the new version reports.
      - name: mypy (types)
        run: uv run --with "mypy==2.3.1" mypy
      - name: ruff (lint src and tests)
        run: uvx ruff@0.16.8 check src tests
      - name: bandit (security lint)
        run: uvx --from "bandit[toml]==1.9.4" bandit -c pyproject.toml -r src

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      # 5.todo C6: the committed requirements.txt must be what uv.lock exports (after changing
      # dependencies: run the export above, commit the file).
      - name: requirements.txt is up to date with uv.lock
        run: git diff --exit-code requirements.txt
      - name: Audit them for known vulnerabilities
        run: uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip
